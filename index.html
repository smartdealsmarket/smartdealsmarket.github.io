    const Armchair = (p) => <Icon {...p}><path d="M19 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v3" /><path d="M3 16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z" /><path d="M5 18v2" /><path d="M19 18v2" /></Icon>;
    const CookingPot = (p) => <Icon {...p}><path d="M2 12h20" /><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" /><path d="m4 8 16-4" /><path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8" /></Icon>;
    const Luggage = (p) => <Icon {...p}><path d="M6 20a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2" /><path d="M8 18V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14" /><path d="M10 20h4" /><circle cx="16" cy="20" r="2" /><circle cx="8" cy="20" r="2" /></Icon>;
    const ArrowUpRight = (p) => <Icon {...p}><path d="M7 7h10v10" /><path d="M7 17 17 7" /></Icon>;
    const Heart = (p) => <Icon {...p}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></Icon>;
    const MessageCircle = (p) => <Icon {...p}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></Icon>;
    const Bookmark = (p) => <Icon {...p}><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" /></Icon>;
    const Tag = (p) => <Icon {...p}><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z" /><circle cx="7.5" cy="7.5" r=".5" fill="currentColor" /></Icon>;
    const Store = (p) => <Icon {...p}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7" /><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" /><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4" /><path d="M2 7h20" /><path d="M22 7v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7" /></Icon>;
    const Navigation = (p) => <Icon {...p}><polygon points="3 11 22 2 13 21 11 13 3 11" /></Icon>;
    const Phone = (p) => <Icon {...p}><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384" /></Icon>;
    const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></Icon>;

    const BrandMark = ({ size = 40 }) => (
      <svg width={size} height={size} viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="10" fill="#FF5500" /><path d="M13 31.5L24 10L35 31.5" stroke="#0B0D10" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round" fill="none" /><path d="M28 36L33.5 27.5L39 36" stroke="#0B0D10" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" fill="none" /></svg>
    );

    const BrandLogo = () => (
      <div className="brand"><BrandMark size={38} /><div className="brand-text" style={{ lineHeight: 1 }}><div className="title">SMART DEALS</div><div className="sub">MARKET</div></div></div>
    );

    const NAV = [{ label: "Store Rules", href: "#rules" },{ label: "Inventory", href: "#inventory" },{ label: "Find Us", href: "#location" },{ label: "Hours", href: "#location" }];

    function Header() {
      const [open, setOpen] = useState(false);
      return (
        <header className="header">
          <div className="container">
            <div className="header-inner">
              <a href="#top"><BrandLogo /></a>
              <nav className="nav-desktop">{NAV.map((n) => (<a key={n.label} href={n.href}>{n.label}</a>))}</nav>
              <div className="header-cta-desktop">
                <div className="header-pill"><span className="dot" style={{ width: 8, height: 8 }} /><span>NEW DROP TODAY</span></div>
                <a href="#location" className="btn btn-primary btn-sm"><MapPin size={16} /> Get Directions</a>
              </div>
              <button className="mobile-toggle" onClick={() => setOpen(!open)}>{open ? <X size={24} /> : <Menu size={24} />}</button>
            </div>
          </div>
          {open && (
            <div className="mobile-menu"><div className="mobile-menu-inner">{NAV.map((n) => (<a key={n.label} href={n.href} onClick={() => setOpen(false)}>{n.label}</a>))}<a href="#location" className="btn btn-primary" onClick={() => setOpen(false)}><MapPin size={16} /> Get Directions</a></div></div>
          )}
        </header>
      );
    }

    function Hero() {
      return (
        <section id="top" className="hero">
          <div className="hero-grain" /><div className="hero-bg-text">DEALS</div><div className="hero-glow" />
          <div className="container hero-content">
            <div className="pill"><span className="dot" /><span>POTOMAC MILLS MALL · WOODBRIDGE, VA</span></div>
            <h1><span className="reveal-line"><span>Big Brands.</span></span><span className="reveal-line"><span><span className="accent">Unbeatable Prices.</span></span></span><span className="reveal-line"><span>Right Around The Corner.</span></span></h1>
            <p className="subhead">Potomac Mills' premier liquidation outlet for home essentials, furniture, luggage, and daily surprises. New truckloads arrive weekly — when it's gone, it's gone.</p>
            <div className="hero-actions">
              <a href="#location" className="btn btn-primary"><MapPin size={18} /> Find Us Inside the Mall</a>
              <a href="https://www.instagram.com/smartdealsmarket_" target="_blank" rel="noopener noreferrer" className="btn btn-secondary"><Instagram size={18} style={{ color: "var(--cyan)" }} /> See This Week's Arrivals</a>
            </div>
            <div className="hero-scroll"><ArrowDown size={16} className="bounce" /><span>SCROLL FOR THE GOOD STUFF</span></div>
          </div>
        </section>
      );
    }

    const MARQUEE_ITEMS = ["WEEKLY TRUCKLOADS","UP TO 70% OFF MSRP","POTOMAC MILLS MALL","WOODBRIDGE, VA","ALL SALES FINAL","FIRST COME FIRST SERVED","NEW DROPS DAILY"];
    const MarqueeGroup = () => (<div className="marquee-group">{MARQUEE_ITEMS.map((t, i) => (<span className="marquee-item" key={i}><span>{t}</span><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 0L8.5 5.5L14 7L8.5 8.5L7 14L5.5 8.5L0 7L5.5 5.5L7 0Z" fill="#0B0D10" /></svg></span>))}</div>);
    const Marquee = () => (<div className="marquee"><div className="marquee-track"><MarqueeGroup /><MarqueeGroup /></div></div>);

    const RULES = [
      { step: "01", title: "Weekly Truckloads", subtitle: "Fresh Inventory Drops", description: "Fresh closeout inventory and top-tier liquidations arriving constantly. What you see today might be gone tomorrow — because next week's truck is already on the road.", icon: Truck, badge: "FRESH ARRIVALS", accent: "#FF5500" },
      { step: "02", title: "First Come, First Served", subtitle: "Treasure Hunter's Rule", description: "We cannot hold items. If you love it, grab it before it's gone! The fastest bargain hunters take home the biggest brand-name trophies.", icon: Zap, badge: "NO HOLDS", accent: "#00E5FF" },
      { step: "03", title: "All Sales Final", subtitle: "Transparent Deep Savings", description: "We pass massive liquidation savings directly to you; all purchases are final. Inspect your items in-store and enjoy up to 70% off retail MSRP.", icon: ShieldCheck, badge: "MAX SAVINGS", accent: "#10B981" }
    ];

    function StoreRules() {
      return (
        <section id="rules" className="section">
          <div className="container">
            <div className="section-head"><span className="eyebrow">HOW WE WORK</span><h2 className="h2">The rules of the hunt.</h2><p className="lead">Three simple rules keep our prices this low — and the thrill this high.</p></div>
            <div className="grid grid-3">
              {RULES.map((r) => {
                const I = r.icon;
                return (
                  <div key={r.title} className="card">
                    <div className="card-glow" style={{ backgroundColor: r.accent }} />
                    <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between" }}><span className="card-num">{r.step}</span><span className="card-badge" style={{ color: r.accent, backgroundColor: r.accent + "1A", border: `1px solid ${r.accent}40` }}>{r.badge}</span></div>
                    <div className="card-icon-wrap" style={{ backgroundColor: r.accent + "14" }}><I size={32} style={{ color: r.accent }} /></div>
                    <h3>{r.title}</h3><p className="subtitle">{r.subtitle}</p><p className="desc">{r.description}</p>
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    }
    const INVENTORY = [
      { id: "home-styling", title: "Home Styling & Furniture", tagline: "Elevate your space for a fraction of store price", discount: "SAVE 40–70% MSRP", items: ["Accent chairs & side tables","Modern lighting & lamps","Area rugs & textiles","Wall mirrors & home decor"], icon: Armchair, badge: "HIGH DEMAND", accent: "#FF5500" },
      { id: "kitchen-hosting", title: "Kitchen & Hosting", tagline: "Chef-grade cookware & entertaining essentials", discount: "SAVE 50–75% MSRP", items: ["Serving platters & hosting trays","Premium cookware sets","Stoneware & glassware","Everyday home essentials"], icon: CookingPot, badge: "NEW DROP", accent: "#00E5FF" },
      { id: "travel-luggage", title: "Travel & Luggage", tagline: "First-class travel gear without the luxury markup", discount: "SAVE 45–70% MSRP", items: ["Multi-size luggage sets","Durable carry-ons","Weekender travel bags","Travel accessories & organizers"], icon: Luggage, badge: "LIMITED STOCK", accent: "#10B981" }
    ];

    function Inventory() {
      return (
        <section id="inventory" className="section inventory-section">
          <div className="container">
            <div className="section-head inventory-head">
              <div><span className="eyebrow cyan">REVOLVING INVENTORY</span><h2 className="h2">This week's treasure map.</h2></div>
              <p className="inventory-desc">Our floor changes constantly — these are the categories hunters ask about most. Stock rotates with every truckload.</p>
            </div>
            <div className="grid grid-3">
              {INVENTORY.map((c) => {
                const I = c.icon;
                return (
                  <article key={c.id} className="inventory-card">
                    <I size={200} className="inventory-ghost-icon" style={{ color: c.accent }} />
                    <div className="inventory-top"><span className="card-badge" style={{ color: c.accent, backgroundColor: c.accent + "1A", border: `1px solid ${c.accent}40` }}>{c.badge}</span><span className="inventory-discount">{c.discount}</span></div>
                    <div className="inventory-icon-wrap" style={{ backgroundColor: c.accent + "14" }}><I size={36} style={{ color: c.accent }} /></div>
                    <h3>{c.title}</h3><p className="inventory-tagline">{c.tagline}</p>
                    <ul className="inventory-list">{c.items.map((it) => (<li key={it}><span className="bullet" style={{ backgroundColor: c.accent }} />{it}</li>))}</ul>
                    <a href="https://www.instagram.com/smartdealsmarket_" target="_blank" rel="noopener noreferrer" className="inventory-link" style={{ color: c.accent }}>See what's in stock <ArrowUpRight size={16} /></a>
                  </article>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    const SOCIAL = [
      { icon: Armchair, label: "Accent Chairs Drop", likes: "342", comments: "28", accent: "#FF5500" },
      { icon: Truck, label: "New Truckload Day", likes: "517", comments: "63", accent: "#00E5FF" },
      { icon: CookingPot, label: "Kitchen Haul", likes: "289", comments: "19", accent: "#10B981" },
      { icon: Luggage, label: "Luggage Sets Restock", likes: "431", comments: "45", accent: "#FF5500" },
      { icon: Tag, label: "70% Off Finds", likes: "608", comments: "71", accent: "#00E5FF" },
      { icon: Store, label: "Inside The Store", likes: "254", comments: "16", accent: "#10B981" }
    ];

    function SocialFeed() {
      return (
        <section id="social" className="section">
          <div className="container">
            <div className="social-head">
              <span className="eyebrow">LIVE FROM THE FLOOR</span><h2 className="h2">Catch the next deal before it sells out.</h2>
              <p className="lead" style={{ marginLeft: "auto", marginRight: "auto", fontSize: "1.125rem" }}>Our stock changes daily. Follow <a href="https://www.instagram.com/smartdealsmarket_" target="_blank" rel="noopener noreferrer" style={{ fontWeight: 700, color: "var(--primary)" }}>@smartdealsmarket_</a> on Instagram — new drops are posted the moment the truck is unloaded.</p>
            </div>
            <div className="social-grid">
              {SOCIAL.map((s, i) => {
                const I = s.icon;
                return (
                  <div key={i} className="social-tile">
                    <div className="social-tile-glow" style={{ background: `radial-gradient(circle at 50% 40%, ${s.accent}26, transparent 70%)` }} />
                    <div className="social-tile-body"><I size={44} style={{ color: s.accent }} /><span className="label">{s.label}</span></div>
                    <span className="social-tag">Preview</span>
                    <div className="social-tile-footer"><span className="social-stat"><Heart size={13} style={{ color: "var(--primary)", fill: "var(--primary)" }} /> {s.likes}</span><span className="social-stat"><MessageCircle size={13} /> {s.comments}</span><Bookmark size={13} style={{ color: "var(--slate-400)" }} /></div>
                  </div>
                );
              })}
            </div>
            <div className="social-cta">
              <a href="https://www.instagram.com/smartdealsmarket_" target="_blank" rel="noopener noreferrer" className="btn btn-primary"><Instagram size={20} /> Follow @smartdealsmarket_</a>
              <p className="social-cta-note">LIVE FEED COMING SOON — FOLLOW FOR REAL-TIME DROPS</p>
            </div>
          </div>
        </section>
      );
    }

    const HOURS = [{ days: "Monday – Saturday", hours: "10:00 AM – 9:00 PM" },{ days: "Sunday", hours: "11:00 AM – 6:00 PM" }];

    function Location() {
      return (
        <footer id="location" className="location-section">
          <div className="container">
            <div className="location-head"><span className="eyebrow">FIND THE TREASURE</span><h2 className="h2">Inside Potomac Mills Mall.</h2></div>
            <div className="location-grid">
              <div className="location-map-col">
                <div className="map-container"><iframe title="Map" src="https://www.google.com/maps?q=2700+Potomac+Mills+Circle,+Woodbridge,+VA+22192&output=embed" loading="lazy" referrerPolicy="no-referrer-when-downgrade" /></div>
              </div>
              <div className="location-cards-col">
                <div className="location-card">
                  <div className="location-card-head"><div className="location-card-icon" style={{ background: "rgba(255,85,0,0.15)" }}><MapPin size={20} style={{ color: "var(--primary)" }} /></div><h3>Where to find us</h3></div>
                  <p>Find us inside <strong style={{ color: "#fff" }}>Potomac Mills Mall</strong> — 2700 Potomac Mills Circle, Woodbridge, VA 22192 — <span style={{ color: "var(--primary)", fontWeight: 600 }}>directly across from T.J. Maxx</span>.</p>
                  <a href="https://www.google.com/maps/search/?api=1&query=2700+Potomac+Mills+Circle+Woodbridge+VA+22192" target="_blank" rel="noopener noreferrer" className="btn btn-primary btn-sm"><Navigation size={16} /> Get Directions</a>
                  <a href="tel:+15712924247" className="btn btn-secondary btn-sm secondary"><Phone size={16} style={{ color: "var(--cyan)" }} /> Call (571) 292-4247</a>
                </div>
                <div className="location-card">
                  <div className="location-card-head"><div className="location-card-icon" style={{ background: "rgba(0,229,255,0.15)" }}><Clock size={20} style={{ color: "var(--cyan)" }} /></div><h3>Operating hours</h3></div>
                  {HOURS.map((h) => (<div key={h.days} className="hours-row"><span>{h.days}</span><span>{h.hours}</span></div>))}
                  <p className="hours-note">Standard Potomac Mills Mall hours</p>
                </div>
              </div>
            </div>
            <div className="footer-bottom">
              <div className="footer-brand"><BrandMark size={30} /><span className="brand-name">SMART DEALS <span style={{ color: "var(--primary)" }}>MARKET</span></span></div>
              <p className="footer-copy">© {new Date().getFullYear()} Smart Deals Market · Potomac Mills Mall · Woodbridge, VA</p>
              <div className="footer-links">
                <a href="tel:+15712924247"><Phone size={16} /> (571) 292-4247</a>
                <a href="https://www.instagram.com/smartdealsmarket_" target="_blank" rel="noopener noreferrer"><Instagram size={16} /> @smartdealsmarket_</a>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    function App() {
      useEffect(() => {
        const onClick = (e) => {
          const link = e.target.closest('a[href^="#"]');
          if (!link) return;
          const id = link.getAttribute("href");
          if (id.length > 1) {
            const el = document.querySelector(id);
            if (el) { e.preventDefault(); const top = el.getBoundingClientRect().top + window.pageYOffset - 80; window.scrollTo({ top, behavior: "smooth" }); }
          }
        };
        document.addEventListener("click", onClick);
        return () => document.removeEventListener("click", onClick);
      }, []);

      return (
        <div style={{ minHeight: "100vh", background: "var(--background)", color: "#fff" }}>
          <Header /><main><Hero /><StoreRules /><Inventory /><SocialFeed /></main><Location />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
